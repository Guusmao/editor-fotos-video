<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Corrige fotos de corrida em lote e edita vídeos, tudo no celular.">
<meta name="theme-color" content="#25282d">
<title>Revelador</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500&display=swap">
<style>
/* Launcher: each editor is a race bib pinned to asphalt. The bib is the one bold element. */
:root {
  --asphalt: #25282d; --asphalt-2: #30343a; --lane: #e4e6e1; --muted: #a6abb2;
  --tyvek: #fbfbf9; --ink: #16181c; --ink-soft: #545a62;
  --photo: #1f4fd8; --video: #f3b61f;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--asphalt); color: var(--lane); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  /* A single lane line down the left edge, the only decoration on the page. */
  background-image: linear-gradient(to right, transparent 22px, rgba(228,230,225,.16) 22px, rgba(228,230,225,.16) 26px, transparent 26px);
}
main {
  max-width: 520px; margin: 0 auto; min-height: 100vh; display: grid; align-content: center; gap: 22px;
  padding-left: max(40px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 32px) calc(env(safe-area-inset-bottom, 0px) + 32px);
}
header h1 { font-family: var(--font-display); font-weight: 800; font-size: 56px; line-height: .9; margin: 0; }
header p { margin: 8px 0 0; color: var(--muted); max-width: 30ch; }

.bib {
  position: relative; display: block; text-decoration: none; color: var(--ink); background: var(--tyvek);
  border-radius: 5px; padding: 22px 22px 18px; border-top: 14px solid var(--band);
  box-shadow: 0 2px 0 rgba(0,0,0,.25);
  transition: transform .18s ease;
}
.bib.photo { --band: var(--photo); transform: rotate(-1.2deg); }
.bib.video { --band: var(--video); transform: rotate(.9deg); }
.bib:active { transform: rotate(0) scale(.98); }
.bib:focus-visible { outline: 3px solid var(--lane); outline-offset: 4px; }
/* Four safety-pin holes, like a real bib. */
.bib::before, .bib::after {
  content: ""; position: absolute; top: 8px; width: 9px; height: 9px; border-radius: 50%;
  background: var(--asphalt);
}
.bib::before { left: 10px; } .bib::after { right: 10px; }
.bib .pins { position: absolute; left: 10px; right: 10px; bottom: 8px; height: 9px; pointer-events: none; }
.bib .pins::before, .bib .pins::after { content: ""; position: absolute; top: 0; width: 9px; height: 9px; border-radius: 50%; background: var(--asphalt); }
.bib .pins::before { left: 0; } .bib .pins::after { right: 0; }
.bib h2 { font-family: var(--font-display); font-weight: 800; font-size: 76px; line-height: .85; margin: 0; letter-spacing: -.01em; }
.bib p { margin: 8px 0 6px; color: var(--ink-soft); font-size: 15px; }

.foot { display: grid; gap: 12px; }
#installBtn {
  font: inherit; font-weight: 500; padding: 13px 16px; border-radius: 5px; border: 0; cursor: pointer;
  background: var(--lane); color: var(--ink);
}
#installBtn:focus-visible { outline: 3px solid var(--lane); outline-offset: 3px; }
.note { color: var(--muted); font-size: 14px; margin: 0; }
@media (prefers-reduced-motion: reduce) { .bib { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Revelador</h1>
    <p>Suas fotos e vídeos de corrida, prontos para postar.</p>
  </header>

  <a class="bib photo" href="fotos/">
    <h2>Fotos</h2>
    <p>Corrige a leva inteira de uma vez e recorta para o Instagram.</p>
    <span class="pins" aria-hidden="true"></span>
  </a>

  <a class="bib video" href="video/">
    <h2>Vídeo</h2>
    <p>Corta, legenda e coloca música no seu vídeo.</p>
    <span class="pins" aria-hidden="true"></span>
  </a>

  <div class="foot">
    <button id="installBtn" hidden>Instalar app</button>
    <p class="note">Tudo fica no seu celular. Nenhuma foto ou vídeo é enviado para servidores.</p>
  </div>
</main>
<script>
let installEvt = null;
const btn = document.getElementById("installBtn");
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; btn.hidden = false; });
window.addEventListener("appinstalled", () => { btn.hidden = true; installEvt = null; });
btn.addEventListener("click", async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch {} installEvt = null; btn.hidden = true; });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
</script>
</body>
</html>
