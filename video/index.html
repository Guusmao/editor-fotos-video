<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14110d">
<meta name="description" content="Rolo: editor de vídeo no navegador, instalável no celular.">
<title>Rolo</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Caveat:wght@500;700&family=Lobster&family=Montserrat:wght@400;800&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:wght@400;800&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="top">
    <button class="brand" id="btnProjects" title="Projetos">
      <img src="icons/mark.svg" alt="" width="26" height="26">
      <span class="brand-name">Rolo</span>
      <span class="proj-name" id="projName">Sem título</span>
    </button>
    <div class="top-actions">
      <a class="chip" href="../fotos/" style="text-decoration:none;display:inline-flex;align-items:center">Fotos</a>
      <button class="chip" id="btnAspect" title="Proporção">9:16</button>
      <button class="btn-primary" id="btnExport">Exportar</button>
    </div>
  </header>

  <section class="stage" id="stage">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="view" width="540" height="960"></canvas>
      <div class="empty-hint" id="emptyHint">
        <button class="big-add" id="btnFirstImport">＋ Adicionar vídeos e fotos</button>
        <p>Tudo fica no seu aparelho. Nada é enviado para servidores.</p>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  </section>

  <div class="transport">
    <button class="icon" id="btnUndo" title="Desfazer">↶</button>
    <button class="icon" id="btnRedo" title="Refazer">↷</button>
    <span class="time" id="timeLabel">00:00.0 / 00:00.0</span>
    <button class="play" id="btnPlay" title="Reproduzir (espaço)">▶</button>
    <button class="icon" id="btnStart" title="Início">⏮</button>
    <button class="icon" id="btnZoomOut" title="Diminuir zoom">－</button>
    <button class="icon" id="btnZoomIn" title="Aumentar zoom">＋</button>
  </div>

  <section class="timeline" id="timeline">
    <div class="tl-scroll" id="tlScroll">
      <div class="tl-inner" id="tlInner">
        <div class="ruler" id="ruler"></div>
        <div class="tracks" id="tracks"></div>
        <div class="playhead" id="playhead"><span></span></div>
      </div>
    </div>
  </section>

  <nav class="tools" id="tools"></nav>
</div>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-head">
    <h3 id="sheetTitle"></h3>
    <button class="icon" id="sheetClose" title="Fechar">✕</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="modal" id="modal" aria-hidden="true">
  <div class="modal-card" id="modalCard"></div>
</div>

<input type="file" id="fileMedia" accept="video/*,image/*,audio/*" multiple hidden>
<input type="file" id="fileAudio" accept="audio/*,video/*" multiple hidden>
<input type="file" id="fileOverlay" accept="video/*,image/*" multiple hidden>
<input type="file" id="fileSrt" accept=".srt,.vtt,text/plain" hidden>
<input type="file" id="fileReplace" accept="video/*,image/*" hidden>

<script type="module" src="js/app.js"></script>
</body>
</html>
